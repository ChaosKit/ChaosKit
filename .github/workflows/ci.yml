name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    name: Lint (Qt C++ / QML / Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format and cmake-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          pip install cmakelang

      - name: Run lint checks on diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          make lint DIFF_RANGE="$RANGE"

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build protobuf-compiler libprotobuf-dev libgl1-mesa-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja protobuf

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"

      - name: Configure CMake
        run: make configure

      - name: Build
        run: make build

      - name: Run CTest
        run: make test
